[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ptedit"
version = "0.1.0"
requires-python = ">=3.12"

[project.scripts]
ptedit = "ptedit.__main__:main"

[tool.pytest.ini_options]
pythonpath = [
  "src"
]
addopts = [
    "--import-mode=importlib",
]

[dependency-groups]
dev = [
    "line-profiler>=5.0.2",
    "pytest-cov>=7.1.0",
]
